<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0f6b5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شمارنده ذکر</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <div class="top"><h1 data-k="title"></h1><div class="row"><button class="btn" id="lg"></button><button class="btn" id="lk" data-k="lock"></button><button class="btn" id="theme"></button></div></div>
  <div id="lgm" class="set" style="display:none"><div id="langs" class="lglist"></div></div>
  <div id="remb" role="status"><span id="remt"></span><button id="remx" aria-label="x">×</button></div>
  <div><p class="label" data-k="zikr"></p><div class="chips" id="zikrs"></div></div>
  <div><p class="label" data-k="goal"></p><div class="chips" id="targets"></div></div>
  <p class="zikr" id="zname"></p>
  <p class="mean" id="zmean"></p>
  <div class="stage">
    <svg viewBox="0 0 260 260" aria-hidden="true"><circle class="track" cx="130" cy="130" r="120"/><circle class="bar" id="bar" cx="130" cy="130" r="120"/></svg>
    <div id="big"></div>
    <button id="tap"><span id="count">0</span><span id="of"></span></button>
  </div>
  <p id="msg" role="status" aria-live="polite"></p>
  <div id="dgw" style="display:none"><p class="label"><span data-k="dgoal"></span>: <b id="dgt"></b></p><div class="pb"><i id="dgb"></i></div></div>
  <div class="week"><p class="label"><span data-k="week"></span>: <b id="wsum"></b></p><div class="bars" id="bars"></div></div>
  <div class="stats">
    <div><b id="best">0</b><span data-k="best"></span></div>
    <div><b id="streak">0</b><span data-k="streak"></span></div>
  </div>
  <div class="stats">
    <div><b id="rounds">0</b><span data-k="rounds"></span></div>
    <div><b id="total">0</b><span data-k="today"></span></div>
  </div>
  <div class="row">
    <button class="btn" id="undo" data-k="undo"></button>
    <button class="btn" id="reset"></button>
    <button class="btn" id="one"></button>
    <button class="btn" id="snd"></button>
    <button class="btn" id="vib"></button>
    <button class="btn" id="shr" data-k="share"></button>
  </div>
  <div class="week" id="zsw" style="display:none"><p class="label" data-k="zs"></p><div id="zsl"></div></div>
  <details class="set">
    <summary data-k="settings"></summary>
    <div class="sec"><p class="label" data-k="dgoal"></p><input type="number" id="dgi" min="0" max="1000000" inputmode="numeric"></div>
    <div class="sec"><p class="label" data-k="color"></p><div class="dots" id="dots"></div></div>
    
    <div class="sec"><p class="label" data-k="remind"></p>
      <div class="row" style="justify-content:flex-start">
        <button class="chip" id="remon"></button>
        <label><span data-k="morning"></span> <input type="time" id="tm"></label>
        <label><span data-k="night"></span> <input type="time" id="tn"></label>
      </div>
      <p class="label" style="margin-top:6px" data-k="remnote"></p>
    </div>
    <div class="sec"><p class="label" data-k="backup"></p>
      <textarea id="bk" aria-label="backup"></textarea>
      <div class="row" style="margin-top:8px"><button class="btn" id="cp" data-k="copy"></button><button class="btn" id="rs" data-k="restore"></button></div>
      <p class="label" id="bm" style="margin-top:6px"></p>
    </div>
  </details>
</main>
<div id="lock"><p data-k="locked" style="font-size:1.3rem;font-weight:800;margin:0"></p><button class="btn" id="unl" data-k="unlock"></button></div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script>
</body>
</html>
